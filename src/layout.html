<!doctype html>
<html lang="nl" class="no-js" data-title-en="{{titleEn}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{desc}}">
  <link rel="canonical" href="{{url}}">
  <link rel="alternate" hreflang="nl" href="{{url}}">
  <meta name="theme-color" content="#0d0d0d">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GH Veilig Fietsen">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{desc}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:locale" content="nl_NL">
  <meta property="og:image" content="{{site}}/assets/img/og.jpg">
  <meta property="og:image:secure_url" content="{{site}}/assets/img/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="GH Veilig Fietsen, fietsenmaker in Utrecht centrum">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{desc}}">
  <meta name="twitter:image" content="{{site}}/assets/img/og.jpg">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v={{ver}}">
  <script type="application/ld+json">{{schema}}</script>
</head>
<body>
{{> icons}}
{{> header}}
<main id="main">
{{content}}
</main>
{{> footer}}
<script src="assets/js/config.js?v={{ver}}"></script>
<script src="assets/js/main.js?v={{ver}}" defer></script>
</body>
</html>
